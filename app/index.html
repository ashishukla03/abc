<!DOCTYPE html>
<html lang="en" data-subject="physics">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#275DDB">
  <meta name="description" content="Gramin PocketLab — Four-Subject STEM Missions for rural schools. Offline-first interactive learning lab.">
  <title>Gramin PocketLab — STEM Missions</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Accessible Keyboard Skip Navigation -->
  <a href="#main-content" class="sr-only sr-only-focusable skip-link">Skip to main content</a>

  <!-- Main Application Wrapper -->
  <div id="app" class="app-container">
    <!-- Global Ambient Motion Graphics Aurora Orbs -->
    <div class="global-aurora-backdrop" aria-hidden="true">
      <div class="ambient-orb ambient-orb--blue"></div>
      <div class="ambient-orb ambient-orb--purple"></div>
      <div class="ambient-orb ambient-orb--amber"></div>
      <div class="ambient-orb ambient-orb--teal"></div>
    </div>

    <!-- Top Persistent Application Bar -->
    <header class="app-header" role="banner">
      <div class="header-inner">
        <!-- Brand Title & Icon -->
        <div class="header-left">
          <a href="#/map" class="app-brand" aria-label="Gramin PocketLab Home">
            <img src="assets/icon.svg" alt="" class="brand-icon" width="28" height="28" aria-hidden="true">
            <span class="brand-title">Gramin PocketLab</span>
          </a>
        </div>

        <!-- Network & Cache Status Indicator -->
        <div class="header-center">
          <span id="network-status-badge" class="status-pill status-pill--offline" role="status" aria-live="polite">
            <span class="status-pill-dot" aria-hidden="true"></span>
            <span id="network-status-text">Offline Ready</span>
          </span>
        </div>

        <!-- Utility Controls: Profile Switcher, Language, Mute, Reset -->
        <div class="header-right">
          <!-- Multi-Profile Switcher Pill -->
          <button type="button" id="btn-header-profile" class="btn btn-ghost profile-header-pill" aria-label="Switch learner profile" title="Switch or create profile">
            <span id="header-profile-avatar" aria-hidden="true" style="display: inline-flex; align-items: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-.838L12.83 2.18a2 2 0 0 0-1.66 0L2.6 10.084a1 1 0 0 0 0 1.832l8.57 7.908a2 2 0 0 0 1.66 0l6.71-6.19"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
            </span>
            <span id="header-profile-name" class="profile-pill-name">Aarav</span>
          </button>

          <!-- Locale Toggle -->
          <button type="button" id="btn-locale-toggle" class="btn btn-ghost" aria-label="Toggle language between English and Kannada" title="Switch language">
            <span id="locale-label" aria-hidden="true">EN | ಕನ್ನ</span>
          </button>

          <!-- Audio Mute Toggle -->
          <button type="button" id="btn-audio-mute" class="btn btn-ghost btn-icon" aria-label="Mute audio tones" title="Toggle audio">
            <span id="audio-mute-icon" aria-hidden="true" style="display: inline-flex; align-items: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </span>
          </button>

          <!-- Mission Reset Trigger -->
          <button type="button" id="btn-mission-reset" class="btn btn-ghost btn-icon" aria-label="Reset lab or mission" title="Reset progress">
            <span aria-hidden="true" style="display: inline-flex; align-items: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </span>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs & Grade Band Bar -->
      <nav class="app-nav-tabs" id="app-nav-tabs" role="navigation" aria-label="Main Views">
        <div class="tabs-container">
          <div class="primary-tabs" role="tablist">
            <button type="button" class="tab-btn active" id="tab-btn-missions" data-tab="missions" role="tab" aria-selected="true">
              <span class="tab-icon" style="display: inline-flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
              </span>
              <span class="tab-label">Question Worlds</span>
            </button>
            <button type="button" class="tab-btn" id="tab-btn-browser" data-tab="browser" role="tab" aria-selected="false">
              <span class="tab-icon" style="display: inline-flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              </span>
              <span class="tab-label">Courses</span>
            </button>
            <button type="button" class="tab-btn" id="tab-btn-hub" data-tab="hub" role="tab" aria-selected="false">
              <span class="tab-icon" style="display: inline-flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 8-4 8 4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M14 22v-4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4"/><path d="M18 5v17"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/></svg>
              </span>
              <span class="tab-label">School Hub</span>
            </button>
            <button type="button" class="tab-btn" id="tab-btn-mock" data-tab="mock-test" role="tab" aria-selected="false">
              <span class="tab-icon" style="display: inline-flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
              </span>
              <span class="tab-label">Mock Exams</span>
            </button>
            <button type="button" class="tab-btn" id="tab-btn-tutor" data-tab="tutor" role="tab" aria-selected="false">
              <span class="tab-icon" style="display: inline-flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
              </span>
              <span class="tab-label">AI Tutor</span>
            </button>
            <button type="button" class="tab-btn" id="tab-btn-profile" data-tab="profile" role="tab" aria-selected="false">
              <span class="tab-icon" style="display: inline-flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <span class="tab-label">Learner Model</span>
            </button>
          </div>

          <div class="grade-band-selector" id="grade-band-selector" role="group" aria-label="Select Grade Band">
            <span class="grade-label">Curriculum Stage:</span>
            <button type="button" class="grade-pill" data-band="preparatory" title="Class 5 Preparatory Stage">Prep (Cl 5)</button>
            <button type="button" class="grade-pill active" data-band="middle" title="Classes 6–8 Middle Stage">Middle (6–8)</button>
            <button type="button" class="grade-pill" data-band="secondary" title="Classes 9–10 Secondary Stage">Sec (9–10)</button>
            <button type="button" class="grade-pill" data-band="senior" title="Classes 11–12 Senior Secondary Stage">Senior (11–12)</button>
          </div>
        </div>
      </nav>

      <!-- Secondary Sub-bar: Active Subject & Step Progress -->
      <div id="header-subbar" class="header-subbar" style="display: none;">
        <span id="header-subject-badge" class="badge badge-phys">Physics</span>
        <div id="header-step-dots" class="step-indicator" role="navigation" aria-label="Mission step progress">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>
    </header>

    <!-- Main Content Dynamic Stage -->
    <main id="main-content" class="app-main" role="main" tabindex="-1">
      <!-- Learning runner mounts screens S0 through S6 here -->
      <div id="runner-stage" class="runner-stage">
        <noscript>
          <div class="callout callout-warning">
            <p><strong>JavaScript is required</strong> to run Gramin PocketLab offline micro-labs.</p>
          </div>
        </noscript>
      </div>
    </main>

    <!-- Bottom Sticky Navigation Action Bar -->
    <nav id="action-bar" class="bottom-bar" aria-label="Mission navigation">
      <div class="bottom-bar-inner">
        <button type="button" id="btn-nav-back" class="btn btn-secondary" style="display: none;">
          ← Back
        </button>
        <button type="button" id="btn-nav-primary" class="btn btn-primary" style="display: none;">
          Continue →
        </button>
      </div>
    </nav>
  </div>

  <!-- Persistent Floating AI Study Companion Widget -->
  <button type="button" id="btn-floating-ai-buddy" class="ai-companion-pill" aria-label="Open PocketLab AI Study Buddy" title="Ask AI Study Companion">
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(99, 102, 241, 0.25); border: 1px solid rgba(165, 180, 252, 0.5); color: #A5B4FC;" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    </span>
    <span style="font-weight: 700; font-size: 13.5px; letter-spacing: -0.01em;">AI Study Buddy</span>
    <span class="status-pill-dot" style="background: #10B981; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px #10B981;" aria-hidden="true"></span>
  </button>

  <!-- Screen Reader Polite Live Region for Announcements -->
  <div id="a11y-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Accessible Reset Confirmation Dialog -->
  <div id="reset-modal-backdrop" class="modal-backdrop" style="display: none;" role="presentation">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title" aria-describedby="reset-modal-desc">
      <h2 id="reset-modal-title" class="modal-header">Reset Mission Options</h2>
      <p id="reset-modal-desc" class="modal-body">
        You can reset only the current interactive experiment to try different parameters, or reset all progress across all four STEM subjects.
      </p>
      <div class="modal-actions">
        <button type="button" id="btn-modal-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="btn-modal-reset-lab" class="btn btn-secondary">Reset Lab Only</button>
        <button type="button" id="btn-modal-reset-all" class="btn btn-primary">Reset All</button>
      </div>
    </div>
  </div>

  <!-- Root Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
